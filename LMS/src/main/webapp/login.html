<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>LMS - System Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f4f7f6; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 400px; padding: 2rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h2 class="text-center mb-4">LMS Login</h2>

    <div class="mb-3">
        <label class="form-label">Role</label>
        <select id="role" class="form-select">
            <option value="Student">Student</option>
            <option value="Lecturer">Lecturer</option>
            <option value="Admin">Administrator</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">User ID (Like: S12345)</label>
        <input type="text" id="username" class="form-control" placeholder="key in ID">
    </div>

    <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" value="123456">
    </div>

    <button onclick="doLogin()" class="btn btn-primary w-100">Sign In</button>
</div>

<script>
    async function doLogin() {
        // Collect user input from UI
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const role = document.getElementById('role').value;

        try {
            // Call Java Servlet (The BFF/Proxy Layer)
            const response = await fetch('http://localhost:8080/LMS_war_exploded/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({
                    username: username,
                    password: password,
                    role: role
                })
            });

            // Parse response from Java Servlet
            const result = await response.json();

            // If authentication is successful
            if (result.status === 'success') {
                alert('Login Successful! Welcome ' + result.role);

                // Store user session data in browser local storage
                localStorage.setItem('userRole', result.role);
                localStorage.setItem('username', username);

                // Redirect to the respective dashboard based on user role
                // Ensure filenames are exactly: admin-dashboard.html, etc.
                if (result.role === "Admin") {
                    window.location.href = "admin-dashboard.html";
                } else if (result.role === "Student") {
                    window.location.href = "student-dashboard.html";
                } else if (result.role === "Lecturer") {
                    window.location.href = "lecturer-dashboard.html";
                }
            } else {
                alert('Login Failed: ' + result.message);
            }
        } catch (error) {
            console.error('System Error:', error);
            alert('Authentication Service is currently unavailable.');
        }
            }

</script>

</body>
</html>
