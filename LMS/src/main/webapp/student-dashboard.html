<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body { background: #f4f6f9; }
        .sidebar { height: 100vh; background: #212529; color: white; padding-top: 20px; position: fixed; width: 16.666667%; z-index: 100; }
        .sidebar a { display: block; color: rgba(255,255,255,0.75); text-decoration: none; padding: 15px 20px; cursor: pointer; transition: 0.2s; }
        .sidebar a:hover, .sidebar a.active { background: #343a40; color: white; border-left: 4px solid #0d6efd; }
        .main-content { margin-left: 16.666667%; padding: 30px; width: 83.333333%; }
        .card-box { border: none; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); background: white; }
        .course-header { background: linear-gradient(to right, #0d6efd, #4e73df); color: white; }
        .assignment-block { border: 1px solid #dee2e6; border-radius: 10px; padding: 20px; background: #ffffff; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }
    </style>
</head>
<body>

<div class="container-fluid p-0">
    <div class="d-flex">
        <div class="sidebar">
            <h3 class="text-white fw-normal my-2" style="font-family: sans-serif; padding-left: 20px;">Student LMS</h3>
            <hr class="text-secondary opacity-25">
            <a onclick="showAppSection('dashboard')" id="nav-dashboard" class="active"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
            <a onclick="logout()" class="text-danger mt-5"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </div>

        <div class="main-content">
            <div id="section-app-dashboard" class="app-main-section">
                <h1>Student Hub (Real DB Sync)</h1>
                <p>Welcome back, <strong class="text-primary" id="lbl-student-id"></strong></p>
                <hr>
                <h3 class="my-4 fw-bold text-dark">My Enrolled Modules (From Database)</h3>
                <div id="dynamic-student-courses" class="row g-4"></div>
            </div>

            <div id="section-app-course-interior" class="app-main-section d-none">
                <button class="btn btn-sm btn-outline-secondary mb-3" onclick="showAppSection('dashboard')"><i class="bi bi-arrow-left"></i> Hub</button>
                <div class="card card-box course-header p-4 mb-4">
                    <h1 id="lblCourseCode" class="fw-bold mb-1">CODE</h1>
                    <p id="lblCourseName" class="lead mb-0 opacity-90">Name</p>
                </div>
                <div id="task-live-display-box"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let activeCourseCode = "";
    const bridgeUrl = "http://localhost:8080/LMS_war_exploded/api/course-bridge";
    const studentUsername = localStorage.getItem("username") || "TEST3";
    let activeCourseRawData = {};

    document.addEventListener("DOMContentLoaded", () => {
        document.getElementById("lbl-student-id").innerText = studentUsername;
        loadEnrolledCoursesFromDB();
    });

    function showAppSection(name) {
        document.querySelectorAll('.app-main-section').forEach(s => s.classList.add('d-none'));
        if(name === 'dashboard') { document.getElementById('section-app-dashboard').classList.remove('d-none'); loadEnrolledCoursesFromDB(); }
        if(name === 'interior') document.getElementById('section-app-course-interior').classList.remove('d-none');
    }

    async function loadEnrolledCoursesFromDB() {
        const hubList = document.getElementById('dynamic-student-courses');
        const res = await fetch(`${bridgeUrl}?mode=fetchAll&student=${studentUsername}`);
        const list = await res.json();
        hubList.innerHTML = '';
        if (list.length === 0) {
            hubList.innerHTML = `<div class="col-12"><div class="p-4 bg-white rounded-3 shadow-sm text-center text-muted">🎉 You are not enrolled in any modules yet!</div></div>`;
            return;
        }
        list.forEach(c => {
            const currentCode = c.courseCode || c.code; const currentName = c.courseName || c.name; const currentLecturer = c.lecturerUsername || c.lecturer;
            hubList.innerHTML += `<div class="col-md-4"><div class="card card-box p-4 h-100 d-flex flex-column justify-content-between shadow-sm"><div><h4 class="fw-bold text-dark mb-1">${currentCode}</h4><p class="text-muted small">${currentName}</p><small class="text-secondary">Lecturer: ${currentLecturer}</small></div><button class="btn btn-primary w-100 mt-3" onclick="openCourseInterior('${currentCode}', '${currentName}')">Enter Course Matrix</button></div></div>`;
        });
    }

    async function openCourseInterior(code, name) {
        activeCourseCode = code;
        document.getElementById('lblCourseCode').innerText = code; document.getElementById('lblCourseName').innerText = name;
        document.getElementById('section-app-dashboard').classList.add('d-none'); document.getElementById('section-app-course-interior').classList.remove('d-none');
        await fetchLiveModelFromDB();
    }

    async function fetchLiveModelFromDB() {
        const res = await fetch(`${bridgeUrl}?mode=fetchAll`);
        const all = await res.json();
        const data = all.find(c => (c.courseCode || c.code) === activeCourseCode) || {};
        activeCourseRawData = data;

        const box = document.getElementById('task-live-display-box'); box.innerHTML = "";

        // Section 1: 公告
        let announceHtml = `<div class="card card-box mb-3 shadow-sm"><div class="card-header bg-danger text-white py-2 fw-bold small"><i class="bi bi-megaphone"></i> Section 1: General & Announcements</div><div class="card-body p-2 bg-light">`;
        if(data.announcements && data.announcements.length > 0) {
            data.announcements.forEach(a => { announceHtml += `<div class="p-2 mb-1 bg-white border rounded small text-dark"><i class="bi bi-chat-dots-fill text-muted me-2"></i>${a.title}</div>`; });
        } else { announceHtml += `<span class="text-muted small p-2 d-block">No announcements posted.</span>`; }
        announceHtml += `</div></div>`; box.insertAdjacentHTML('beforeend', announceHtml);

        // Section 2: 课件
        let materialHtml = `<div class="card card-box mb-3 shadow-sm"><div class="card-header bg-dark text-white py-2 fw-bold small"><i class="bi bi-journal-code"></i> Section 2: Slides, Material Notes & Syllabus</div><div class="card-body p-2 bg-light">`;
        if(data.materials && data.materials.length > 0) {
            data.materials.forEach(m => {
                materialHtml += `<div class="p-2 mb-1 bg-white border rounded small d-flex justify-content-between align-items-center"><div><i class="bi bi-file-earmark-pdf-fill text-primary me-2"></i><strong>${m.title}</strong> <span class="text-muted small">(${m.file})</span></div><button onclick="executeRealStreamDownload('${m.file}', '${m.fileStream}')" class="btn btn-xs btn-outline-primary py-0 px-2 small fw-bold"><i class="bi bi-download"></i> Download Notes</button></div>`;
            });
        } else { materialHtml += `<span class="text-muted small p-2 d-block">No material packets uploaded.</span>`; }
        materialHtml += `</div></div>`; box.insertAdjacentHTML('beforeend', materialHtml);

        // 🌟🌟🌟 Section 3: 作业活动专区 (全面重构为支持多作业卡片遍历)
        let historyList = data.assignmentsHistory || [];
        // 兜底判定：如果历史池是空的但是有单条主作业，则强行塞入作为第一张卡片
        if (historyList.length === 0 && data.taskTitle) {
            historyList.push({ taskTitle: data.taskTitle, dueDate: data.dueDate, questionFile: data.questionFile, fileDataStream: data.fileDataStream });
        }

        if (historyList.length === 0) {
            box.insertAdjacentHTML('beforeend', `<div class="alert alert-secondary small p-2"><i class="bi bi-info-circle me-1"></i> No coursework published by lecturer.</div>`);
            return;
        }

        // 开启大外壳
        let assignmentSectionHtml = `
        <div class="card card-box border-warning mb-3 shadow-sm">
            <div class="card-header bg-warning text-dark py-2 fw-bold small"><i class="bi bi-cloud-arrow-up-fill"></i> Section 3: Active Coursework Assignment List (${historyList.length} Tasks Tracked)</div>
            <div class="card-body p-3 bg-light" id="student-assignment-cards-container">
            </div>
        </div>`;
        box.insertAdjacentHTML('beforeend', assignmentSectionHtml);

        const cardsContainer = document.getElementById('student-assignment-cards-container');

        // 🌟 核心修复循环：循环把每一个独立的任务单独生成一整条交互卡片！
        historyList.forEach((task, index) => {
            // 查一下当前同学针对“这一个特定作业题目”在 submissions 数组里有没有交过功课
            const myRecord = (data.submissions || []).find(s => s.id === studentUsername && s.activeTask === task.taskTitle) || { status: "Not Submitted", file: "None", grade: "Ungraded" };
            const isDone = myRecord.status === 'Submitted';

            let singleCardHtml = `
            <div class="assignment-block">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h4 class="fw-bold text-dark mb-1"><span class="badge bg-secondary me-2 fs-6">Task ${index+1}</span>${task.taskTitle}</h4>
                        <p class="text-danger small mb-2"><i class="bi bi-calendar-event me-1"></i>Submission Deadline: <strong>${task.dueDate}</strong></p>
                        <div class="p-2 bg-light border rounded small mb-2">
                            📄 Question Specs Brief: <button onclick="executeRealStreamDownload('${task.questionFile}', '${task.fileDataStream}')" class="btn btn-link btn-sm text-primary text-decoration-underline p-0 fw-bold">${task.questionFile}</button>
                        </div>

                        ${isDone ? `
                            <div class="alert alert-success p-2 small mb-0 fw-bold text-truncate"><i class="bi bi-check-circle-fill me-1"></i> Successfully Committed Answer: <span class="text-dark">${myRecord.file}</span></div>
                        ` : `
                            <form id="form-submit-${index}" onsubmit="pushAnswerToBridge(event, '${task.taskTitle}', ${index})" class="mt-2 p-2 bg-light rounded border">
                                <label class="form-label small fw-bold text-secondary mb-1">Upload Solution Document (PDF / ZIP)</label>
                                <div class="input-group input-group-sm">
                                    <input type="file" class="form-control" id="studentFileEmbed-${index}" required>
                                    <button type="submit" class="btn btn-warning fw-bold text-dark px-3"><i class="bi bi-send"></i> Submit Task</button>
                                </div>
                            </form>
                        `}
                    </div>
                    <div class="col-md-4 text-end border-start">
                        <span class="badge ${isDone?'bg-success':'bg-danger'} fs-6 px-3 py-1 mb-2">${isDone ? 'COMMITTED' : 'PENDING'}</span>
                        <div class="small text-muted mt-1">Evaluation Grade:</div>
                        <div class="text-primary fw-bold fs-4">${myRecord.grade}</div>
                    </div>
                </div>
            </div>`;
            cardsContainer.insertAdjacentHTML('beforeend', singleCardHtml);
        });
    }

    function executeRealStreamDownload(filename, base64Data) {
        if(!base64Data || base64Data === "undefined" || base64Data === "") { alert("No stream packet matched inside cluster database."); return; }
        const binaryString = window.atob(base64Data);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) { bytes[i] = binaryString.charCodeAt(i); }
        const blob = new Blob([bytes], { type: 'application/octet-stream' });
        const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = filename;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }

    // 🌟 强力对准：提交特定序号的作业卡片，并将对应的作业名 taskTitle 绑定死锁送入主库
    async function pushAnswerToBridge(e, targetTaskTitle, index) {
        e.preventDefault();
        const fileInput = document.getElementById(`studentFileEmbed-${index}`);
        const file = fileInput.files[0];

        if(!file) { alert("Please attach your solution document!"); return; }

        // 限制演示时使用小文件，保护云端限流机制
        if (file.size > 2 * 1024 * 1024) {
            alert("⚠️ Alert: To prevent MongoDB Atlas from throttling connection pools during evaluation, please choose an assignment text or PDF file smaller than 2MB!");
            return;
        }

        const reader = new FileReader();
        reader.onload = async function(event) {
            const arrayBuffer = event.target.result;
            const bytes = new Uint8Array(arrayBuffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
            const base64FileStream = window.btoa(binary);

            // 🚀 1. 精准投递主库 3002，让指定作业名的 submissions 那一行秒变绿
            try {
                await fetch("http://localhost:8000/courses/courses/submit-status", {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        courseCode: activeCourseCode,
                        studentId: studentUsername,
                        fileName: file.name,
                        studentStream: base64FileStream,
                        taskTitle: targetTaskTitle // 🌟 挂接作业名字！
                    })
                });
            } catch(err) { console.error("Failed to sync status to 3002:", err); }

            // 🚀 2. 跨库实体保存至 3004 专门作业实体库中一条独立沉淀
            const submitPayload = {
                courseId: activeCourseCode,
                taskName: targetTaskTitle,
                studentId: studentUsername,
                fileName: file.name,
                fileBlobStream: base64FileStream
            };

            await fetch("http://localhost:8000/assignments/assignments/submit", {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(submitPayload)
            });

            alert(`🎉 Solution Package successfully committed for [${targetTaskTitle}]!`);
            await fetchLiveModelFromDB();
        };
        reader.readAsArrayBuffer(file);
    }

    function logout() { localStorage.clear(); window.location.href = "login.html"; }
</script>
</body>
</html>
